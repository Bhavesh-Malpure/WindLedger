services:
  backend:
    build:
      context: ./backend
    image: windledger-backend:local
    environment:
      ELEXON_API_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      FORCE_FIXTURE_MODE: "false"
      ALLOW_FIXTURE_FALLBACK: "false"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: "8000"
      HTTP_TIMEOUT_SECONDS: "15"
      MAX_RETRIES: "3"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: windledger-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
